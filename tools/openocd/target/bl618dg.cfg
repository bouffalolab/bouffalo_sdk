# BL618DG target configuration.
# Select an adapter first, for example:
# openocd -f interface/ch347.cfg -f target/bl618dg.cfg
# openocd -f interface/nuclei_ftdi.cfg -f target/bl618dg.cfg
# The AP is selected by default. Attach to an already released NP with:
# openocd -f interface/nuclei_ftdi.cfg -c "set DEBUG_CPU np" -f target/bl618dg.cfg
# NP is held in reset after a chip reset and must first be released by AP code.

## bindto 0.0.0.0 can be used to cover all available interfaces.
## Uncomment bindto line to enable remote machine debug.
# bindto 0.0.0.0

if { ![info exists DEBUG_CPU] } {
    set DEBUG_CPU ap
}
set DEBUG_CPU [string tolower $DEBUG_CPU]
if { ($DEBUG_CPU ne "ap") && ($DEBUG_CPU ne "np") } {
    error "Invalid DEBUG_CPU '$DEBUG_CPU': expected ap or np"
}
puts "BL618DG debug CPU: $DEBUG_CPU"

#jtag_ntrst_delay 200

#0x10900a6d
set _CHIPNAME0 riscv0
jtag newtap $_CHIPNAME0 cpu -irlen 5 -expected-id 0x10900a6d
set _TARGETNAME0_0 $_CHIPNAME0.cpu

#0x10900a6d
set _CHIPNAME1 riscv1
jtag newtap $_CHIPNAME1 cpu -irlen 5 -expected-id 0x10900a6d
set _TARGETNAME1_0 $_CHIPNAME1.cpu

# The scan-chain order was verified on BL618DG B0 hardware: riscv0 is NP and
# riscv1 is AP. Only create a target for the selected TAP.
if { $DEBUG_CPU eq "ap" } {
    target create $_TARGETNAME1_0 riscv -chain-position $_CHIPNAME1.cpu -coreid 0
} else {
    target create $_TARGETNAME0_0 riscv -chain-position $_CHIPNAME0.cpu -coreid 0
}

# GDB memory attributes for BL618DG are configured from bl618dg_memmap.gdb:
# source tools/openocd/target/bl618dg_memmap.gdb
gdb memory_map enable
gdb flash_program disable
riscv set_mem_access progbuf sysbus abstract

riscv set_command_timeout_sec 10

init

if { ($DEBUG_CPU eq "ap") && [info exists pulse_srst] &&
     [llength [info commands adapter_pulse_srst]] } {
    adapter_pulse_srst
}

halt

# We must turn on this because otherwise the IDE version debug cannot download the program into flash

arm semihosting enable
