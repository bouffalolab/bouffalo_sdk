# BL618DG target configuration.
# Select an adapter first, for example:
# openocd -f interface/ch347.cfg -f target/bl618dg.cfg
# openocd -f interface/nuclei_ftdi.cfg -f target/bl618dg.cfg
# The AP is selected by default. Attach to an already released NP with:
# openocd -f interface/nuclei_ftdi.cfg -c "set DEBUG_CPU np" -f target/bl618dg.cfg
# NP is held in reset after a chip reset and must first be released by AP code.
# Reset selection examples:
#   -c "set RESET_TYPE debug; set RESET_ACTION halt"
#   -c "set RESET_TYPE srst;  set RESET_ACTION run"
#
# RESET_TYPE:
#   debug - use RISC-V Debug Module ndmreset; no PU_CHIP/SRST wire needed
#   srst  - use the adapter's physical SRST output
#   none  - do not reset; only halt the currently running target
# RESET_ACTION is halt or run and applies to debug/srst reset.
# The default keeps the historical attach behavior: no reset, then halt.

if { ![info exists RESET_TYPE] } {
    set RESET_TYPE none
}

if { ![info exists RESET_ACTION] } {
    set RESET_ACTION halt
}
set RESET_ACTION [string tolower $RESET_ACTION]
if {[lsearch -exact {halt run} $RESET_ACTION] < 0} {
    error "Invalid RESET_ACTION '$RESET_ACTION': expected halt or run"
}

# OpenOCD target polling is enabled by default after init.  poll_period only
# changes the timer interval; it does not disable the polling callback.  Keep
# the state controlled by this script while a reset temporarily removes the
# JTAG/DMI path.
set _BL618DG_POLLING_ENABLED 1
set _BL618DG_POLLING_SAVED ""

proc bl618dg_poll_off {} {
    global _BL618DG_POLLING_ENABLED _BL618DG_POLLING_SAVED

    if {$_BL618DG_POLLING_SAVED eq ""} {
        # `poll` reports the actual OpenOCD state before polling the target.
        # Prefer that over the script cache so a user-issued `poll off` is
        # preserved across reset.  If the query itself fails, retain the last
        # state controlled by this script.
        if {![catch {set poll_status [capture "poll"]}]} {
            if {[string first "background polling: off" $poll_status] >= 0} {
                set _BL618DG_POLLING_ENABLED 0
            } elseif {[string first "background polling: on" $poll_status] >= 0} {
                set _BL618DG_POLLING_ENABLED 1
            }
        }
        set _BL618DG_POLLING_SAVED $_BL618DG_POLLING_ENABLED
    }
    poll off
    set _BL618DG_POLLING_ENABLED 0
}

proc bl618dg_poll_restore {} {
    global _BL618DG_POLLING_ENABLED _BL618DG_POLLING_SAVED

    if {$_BL618DG_POLLING_SAVED eq ""} {
        return
    }
    if {$_BL618DG_POLLING_SAVED} {
        poll on
    } else {
        poll off
    }
    set _BL618DG_POLLING_ENABLED $_BL618DG_POLLING_SAVED
    set _BL618DG_POLLING_SAVED ""
}

proc bl618dg_set_reset_type {reset_type} {
    global RESET_TYPE

    set reset_type [string tolower $reset_type]
    switch -- $reset_type {
        debug {
            # With no SRST configured, the RISC-V target reset handler uses
            # dmcontrol.ndmreset through JTAG-DMI.
            reset_config none
        }
        srst {
            # PU_CHIP is a high-active power/reset control.  Do not register
            # it as OpenOCD's generic SRST: that state machine asserts SRST
            # during target initialization, before the JTAG chain is scanned.
            # bl618dg_external_reset controls the adapter line explicitly
            # after target examination has completed.
            reset_config none
        }
        none {
            reset_config none
        }
        default {
            error "Invalid RESET_TYPE '$reset_type': expected debug, srst, or none"
        }
    }

    set RESET_TYPE $reset_type
    puts "BL618DG reset type: $RESET_TYPE"
}

proc bl618dg_reset {{reset_action halt}} {
    global RESET_TYPE

    set reset_action [string tolower $reset_action]
    if {[lsearch -exact {halt run} $reset_action] < 0} {
        error "Invalid RESET_ACTION '$reset_action': expected halt or run"
    }

    if {$RESET_TYPE eq "none"} {
        puts "BL618DG reset disabled; halting target without reset"
        halt
        return
    }

    if {$RESET_TYPE eq "debug"} {
        bl618dg_debug_reset $reset_action
        return
    }

    if {$RESET_TYPE eq "srst"} {
        bl618dg_external_reset $reset_action
        return
    }

    puts "BL618DG reset: type=$RESET_TYPE action=$reset_action"
    reset $reset_action
}

bl618dg_set_reset_type $RESET_TYPE

## bindto 0.0.0.0 can be used to cover all available interfaces.
## Uncomment bindto line to enable remote machine debug.
# bindto 0.0.0.0

if { ![info exists DEBUG_CPU] } {
    set DEBUG_CPU ap
}
set DEBUG_CPU [string tolower $DEBUG_CPU]
if { ($DEBUG_CPU ne "ap") && ($DEBUG_CPU ne "np") } {
    error "Invalid DEBUG_CPU '$DEBUG_CPU': expected ap or np"
}
puts "BL618DG debug CPU: $DEBUG_CPU"

#jtag_ntrst_delay 200

#0x10900a6d
set _CHIPNAME0 riscv0
jtag newtap $_CHIPNAME0 cpu -irlen 5 -expected-id 0x10900a6d
set _TARGETNAME0_0 $_CHIPNAME0.cpu

#0x10900a6d
set _CHIPNAME1 riscv1
jtag newtap $_CHIPNAME1 cpu -irlen 5 -expected-id 0x10900a6d
set _TARGETNAME1_0 $_CHIPNAME1.cpu

# The scan-chain order was verified on BL618DG B0 hardware: riscv0 is NP and
# riscv1 is AP. Only create a target for the selected TAP.
if { $DEBUG_CPU eq "ap" } {
    target create $_TARGETNAME1_0 riscv -chain-position $_CHIPNAME1.cpu -coreid 0
    set _BL618DG_TARGETNAME $_TARGETNAME1_0
} else {
    target create $_TARGETNAME0_0 riscv -chain-position $_CHIPNAME0.cpu -coreid 0
    set _BL618DG_TARGETNAME $_TARGETNAME0_0
}

# BL618DG's Debug Module does not report havereset reliably after ndmreset.
# OpenOCD's generic `reset halt` consequently waits for allhavereset and can
# time out even though the hart is already accessible and halted.  Use the
# DMI dmcontrol register directly and wait for a valid, available, halted
# hart instead.
proc bl618dg_dmstatus_ready {dmstatus} {
    # Debug spec 0.13/1.0: version = 2/3, authenticated = bit 7.
    # Reject unavailable/nonexistent harts (bits 12..15) and require the
    # selected hart to report allhalted (bit 9) or allrunning (bit 11).
    # A successful DMI transaction alone does not prove that the DM is ready.
    set version [expr {$dmstatus & 0xf}]
    return [expr {($version == 2 || $version == 3) &&
        ($dmstatus & 0x80) != 0 && ($dmstatus & 0xf000) == 0 &&
        ($dmstatus & 0xa00) != 0}]
}

proc bl618dg_wait_halted {target} {
    # Allow 10 seconds of retries after reset, including DMI command time.
    # One transport command can exceed this budget before it returns.
    set deadline [expr {[ms] + 10000}]
    set dmstatus unreadable
    while {1} {
        if {[catch {set dmstatus [$target riscv dmi_read 0x11]} err]} {
            if {[ms] >= $deadline} {
                error "BL618DG reset: cannot read dmstatus: $err"
            }
        } elseif {[bl618dg_dmstatus_ready $dmstatus] && ($dmstatus & 0x200) != 0} {
            # dmstatus.allhalted = bit 9.
            return
        }
        set remaining [expr {$deadline - [ms]}]
        if {$remaining <= 0} {
            break
        }
        sleep [expr {$remaining < 50 ? $remaining : 50}]
    }

    error "BL618DG reset: hart did not become halted (dmstatus=$dmstatus)"
}

proc bl618dg_debug_reset {{reset_action halt}} {
    global _BL618DG_TARGETNAME

    set reset_action [string tolower $reset_action]
    if {[lsearch -exact {halt run} $reset_action] < 0} {
        error "Invalid RESET_ACTION '$reset_action': expected halt or run"
    }

    # dmcontrol layout: dmactive bit 0, ndmreset bit 1, haltreq bit 31.
    # Keep haltreq asserted during reset when the caller requested halt.
    set haltreq 0
    if {$reset_action eq "halt"} {
        set haltreq 0x80000000
    }

    puts "BL618DG debug reset: ndmreset, action=$reset_action"
    bl618dg_poll_off
    set result [catch {
        $_BL618DG_TARGETNAME riscv dmi_write 0x10 [expr {$haltreq | 0x3}]
        sleep 2
        $_BL618DG_TARGETNAME riscv dmi_write 0x10 [expr {$haltreq | 0x1}]
        sleep 2
        if {$reset_action eq "halt"} {
            bl618dg_wait_halted $_BL618DG_TARGETNAME
            $_BL618DG_TARGETNAME riscv dmi_write 0x10 0x1
        }
    } err]
    if {$result} {
        # A failed deassert transaction may leave ndmreset/haltreq asserted.
        # Try to release both while preserving the original failure report.
        catch {$_BL618DG_TARGETNAME riscv dmi_write 0x10 0x1}
        # The DMI path may still be unavailable; reconnect will restore
        # polling once the JTAG pin mux is back.
        return -code error $err
    }
    if {$reset_action eq "halt"} {
        bl618dg_poll_restore
        poll
    } else {
        # ndmreset was released with haltreq clear, so the hart is already
        # running.  Calling `resume` here is invalid because OpenOCD's resume
        # command requires a halted hart and reports "Not halted".  Leave the
        # hart running; the caller can halt it later through Telnet/GDB after
        # application code has configured the JTAG GPIO mux.
        # Keep target polling disabled while the application is still using
        # its reset/default pin mux.  bl618dg_jtag_reconnect restores it after
        # the scan chain and DMI are available again.
        return
    }
}

proc bl618dg_external_reset {{reset_action halt}} {
    global _BL618DG_TARGETNAME

    set reset_action [string tolower $reset_action]
    if {[lsearch -exact {halt run} $reset_action] < 0} {
        error "Invalid RESET_ACTION '$reset_action': expected halt or run"
    }

    # The FT2232 nSRST line is connected to PU_CHIP.  For a high-active
    # power-enable signal, drive nSRST low to power the chip off, then drive
    # it high again to let the chip restart from BootROM.
    if {![llength [info commands ftdi]]} {
        error "BL618DG external reset requires the FTDI adapter (interface/nuclei_ftdi.cfg)"
    }

    set pulse_width 100
    set reset_delay 500
    set configured_pulse_width [adapter srst pulse_width]
    set configured_reset_delay [adapter srst delay]
    if {[regexp {([0-9]+)$} $configured_pulse_width -> value] && $value > 0} {
        set pulse_width $value
    }
    if {[regexp {([0-9]+)$} $configured_reset_delay -> value] && $value > 0} {
        set reset_delay $value
    }

    puts "BL618DG external reset: nSRST/PU_CHIP, action=$reset_action, pulse=${pulse_width}ms, delay=${reset_delay}ms"
    # reset_config is deliberately "none" above to prevent OpenOCD from
    # asserting SRST before JTAG examination.  Drive the configured FTDI
    # nSRST signal directly for this post-examination reset instead.
    # PU_CHIP removes power from the Debug Module while low, so stop the
    # OpenOCD server poller before toggling it.  Otherwise a background DMI
    # access can occupy the transport for the full command timeout.
    bl618dg_poll_off
    if {[catch {ftdi set_signal nSRST 0} err]} {
        # The adapter may have changed the pin before reporting an error.
        # Release PU_CHIP, but leave polling off until DMI is verified again.
        catch {ftdi set_signal nSRST 1}
        return -code error $err
    }
    set result [catch {
        sleep $pulse_width
        ftdi set_signal nSRST 1
    } err]
    if {$result} {
        # Never leave PU_CHIP intentionally asserted after a failed pulse.
        catch {ftdi set_signal nSRST 1}
        return -code error $err
    }
    sleep $reset_delay

    if {$reset_action eq "run"} {
        # BootROM may intentionally leave the JTAG GPIO mux disabled.  Some
        # applications configure the JTAG pins later (helloworld waits 3 s),
        # so an immediate arp_init here would fail before the application
        # reaches its pinmux code.  Return with the hart running and let the
        # caller rescan after the application reports that JTAG is ready.
        return
    }

    # PU_CHIP may have powered the JTAG TAP off.  Re-enter the standard
    # JTAG reset/scan sequence before accessing the Debug Module again.
    set chain_ready 0
    for {set i 0} {$i < 20} {incr i} {
        if {![catch {jtag arp_init}]} {
            set chain_ready 1
            break
        }
        sleep 50
    }
    if {!$chain_ready} {
        error "BL618DG external reset: JTAG scan chain did not recover; polling remains off, retry bl618dg_jtag_reconnect after the application restores the JTAG pin mux"
    }

    if {$reset_action eq "halt"} {
        # Do not call generic `reset halt`: its havereset wait is not valid
        # for BL618DG.  Send haltreq through DMI after the chip is back.
        set halt_requested 0
        for {set i 0} {$i < 200} {incr i} {
            if {![catch {$_BL618DG_TARGETNAME riscv dmi_write 0x10 0x80000001}]} {
                set halt_requested 1
                break
            }
            sleep 50
        }
        if {!$halt_requested} {
            catch {$_BL618DG_TARGETNAME riscv dmi_write 0x10 0x1}
            error "BL618DG external reset: Debug Module did not become accessible"
        }
        if {[catch {
            bl618dg_wait_halted $_BL618DG_TARGETNAME
            $_BL618DG_TARGETNAME riscv dmi_write 0x10 0x1
        } err]} {
            catch {$_BL618DG_TARGETNAME riscv dmi_write 0x10 0x1}
            return -code error $err
        }
        bl618dg_poll_restore
        poll
    }
}

# This command is also available from GDB as:
#   monitor bl618dg_sw_reset halt
proc bl618dg_sw_reset {{reset_action halt}} {
    bl618dg_debug_reset $reset_action
}

# External FT2232 nSRST/PU_CHIP reset, available from GDB/Telnet.
proc bl618dg_srst_reset {{reset_action halt}} {
    bl618dg_external_reset $reset_action
}

# Reconnect after application code has configured the JTAG GPIO mux.  This is
# needed when BootROM leaves the selected JTAG pins disabled after reset.
proc bl618dg_jtag_reconnect {{reconnect_action halt} {timeout_ms 10000}} {
    global _BL618DG_TARGETNAME

    set reconnect_action [string tolower $reconnect_action]
    if {[lsearch -exact {halt run} $reconnect_action] < 0} {
        error "Invalid reconnect action '$reconnect_action': expected halt or run"
    }
    if {![string is integer -strict $timeout_ms] || $timeout_ms < 0} {
        error "Invalid JTAG reconnect timeout '$timeout_ms': expected a non-negative integer in milliseconds"
    }

    puts "BL618DG JTAG reconnect: action=$reconnect_action, timeout=${timeout_ms}ms"
    bl618dg_poll_off

    # Include scan/DMI command time in the retry budget.  A single transport
    # command can still take up to OpenOCD's own command timeout.
    set deadline [expr {[ms] + $timeout_ms}]
    set first_attempt 1
    set chain_ready 0
    while {$first_attempt || [ms] < $deadline} {
        set first_attempt 0
        if {![catch {jtag arp_init}]} {
            # PU_CHIP resets dmactive.  Activate the DM before checking the
            # hart, and reject invalid status during pinmux transitions.
            if {![catch {
                $_BL618DG_TARGETNAME riscv dmi_write 0x10 0x1
                set dmstatus [$_BL618DG_TARGETNAME riscv dmi_read 0x11]
            }] && [bl618dg_dmstatus_ready $dmstatus]} {
                set chain_ready 1
                break
            }
        }
        set remaining [expr {$deadline - [ms]}]
        if {$remaining <= 0} {
            break
        }
        sleep [expr {$remaining < 50 ? $remaining : 50}]
    }
    if {!$chain_ready} {
        error "BL618DG JTAG reconnect: scan chain is not available; polling remains off, retry after the application configures the JTAG GPIO mux"
    }

    if {$reconnect_action eq "halt"} {
        set result [catch {
            $_BL618DG_TARGETNAME riscv dmi_write 0x10 0x80000001
            bl618dg_wait_halted $_BL618DG_TARGETNAME
            $_BL618DG_TARGETNAME riscv dmi_write 0x10 0x1
        } err]
        if {$result} {
            catch {$_BL618DG_TARGETNAME riscv dmi_write 0x10 0x1}
            return -code error $err
        }
    }

    bl618dg_poll_restore
    if {$reconnect_action eq "halt"} {
        poll
    }
}

# GDB memory attributes for BL618DG are configured from bl618dg_memmap.gdb:
# source tools/openocd/target/bl618dg_memmap.gdb
gdb memory_map enable
gdb flash_program disable
riscv set_mem_access progbuf sysbus abstract

riscv set_command_timeout_sec 10

init

bl618dg_reset $RESET_ACTION

# We must turn on this because otherwise the IDE version debug cannot download the program into flash

arm semihosting enable
