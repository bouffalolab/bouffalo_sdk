[binaries]
c = '/usr/bin/riscv64-unknown-elf-gcc'
ar = '/usr/bin/riscv64-unknown-elf-ar'
as = '/usr/bin/riscv64-unknown-elf-as'
strip = '/usr/bin/riscv64-unknown-elf-strip'

[built-in options]
c_args = ['-march=rv32imafc', '-mabi=ilp32f', '-misa-spec=2.2']

[properties]
skip_sanity_check = true
cpu_dir = 'riscv'

[host_machine]
system = 'none'
cpu_family = 'riscv32'
cpu = 'rv32imafc'
endian = 'little'
